name: Publish NuGet

on:
  push:
    tags:
      - "v*"
      - "tcp/v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      - name: Build (Release)
        run: dotnet build Communication.sln -c Release --verbosity minimal

      - name: Test
        run: >
          dotnet test Test/Communication.Tests -c Release
          --no-build --verbosity minimal

  publish-shared:
    needs: verify
    if: ${{ !startsWith(github.ref_name, 'tcp/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION (tag: $TAG)"

      - name: Pack (Source libraries only)
        run: |
          OUT="${{ github.workspace }}/artifacts"
          mkdir -p "$OUT"
          VER="${{ steps.ver.outputs.version }}"
          for proj in \
            Source/Communication.Shared/Communication.Shared.csproj
          do
            dotnet pack "$proj" \
              -c Release \
              -o "$OUT" \
              -p:Version="$VER" \
              -p:PackageVersion="$VER" \
              --verbosity minimal
          done

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY secret is not set."
            exit 1
          fi
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  publish-tcp:
    needs: verify
    if: ${{ startsWith(github.ref_name, 'tcp/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#tcp/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION (tag: $TAG)"

      - name: Pack (TCP libraries only)
        run: |
          OUT="${{ github.workspace }}/artifacts"
          mkdir -p "$OUT"
          VER="${{ steps.ver.outputs.version }}"
          PROJS="Source/Communication.Network.TCP.Shared"
          PROJS="$PROJS Source/Communication.Network.TCP.Server"
          PROJS="$PROJS Source/Communication.Network.TCP.Client"
          for dir in $PROJS
          do
            dotnet pack "$dir/${dir##*/}.csproj" \
              -c Release \
              -o "$OUT" \
              -p:Version="$VER" \
              -p:PackageVersion="$VER" \
              --verbosity minimal
          done

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY secret is not set."
            exit 1
          fi
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
